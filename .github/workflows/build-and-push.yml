name: Publish images to Docker Hub

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    outputs:
      versions: ${{ steps.versions.outputs.versions }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: versions
        run: echo "versions=$(jq -c . build-versions.json)" >> "$GITHUB_OUTPUT"

  build:
    name: PHP ${{ matrix.version.php }} / Node ${{ matrix.version.node }} / ${{ matrix.platform.arch }}
    needs: prepare
    # Manual publishing is restricted to the trusted release branch too.
    if: github.ref == 'refs/heads/master'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.prepare.outputs.versions) }}
        platform:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    uses: ./.github/workflows/build-images.yml
    with:
      php-version: ${{ matrix.version.php }}
      node-version: ${{ matrix.version.node }}
      arch: ${{ matrix.platform.arch }}
      runner: ${{ matrix.platform.runner }}
      publish: true
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  manifests:
    name: Publish PHP ${{ matrix.version.php }} manifests
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        version: ${{ fromJSON(needs.prepare.outputs.versions) }}
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Candidate tags are pushed by build-images.yml.
      - name: Assemble multi-platform tags
        env:
          CANDIDATE: build-${{ github.run_id }}-php-${{ matrix.version.php }}
          PHP_VERSION: ${{ matrix.version.php }}
          NODE_VERSION: ${{ matrix.version.node }}
        run: |
          docker buildx imagetools create --tag "croneu/phpapp-fpm:php-$PHP_VERSION" \
            "croneu/phpapp-fpm:$CANDIDATE-amd64" \
            "croneu/phpapp-fpm:$CANDIDATE-arm64"
          docker buildx imagetools create --tag "croneu/phpapp-ssh:php-$PHP_VERSION-node-$NODE_VERSION" \
            "croneu/phpapp-ssh:$CANDIDATE-node-$NODE_VERSION-amd64" \
            "croneu/phpapp-ssh:$CANDIDATE-node-$NODE_VERSION-arm64"

  descriptions:
    needs: manifests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Update FPM Docker Hub description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: croneu/phpapp-fpm
          short-description: ${{ github.event.repository.description }} - PHP-FPM

      - name: Update SSH Docker Hub description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: croneu/phpapp-ssh
          short-description: ${{ github.event.repository.description }} - SSH
