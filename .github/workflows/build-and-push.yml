name: Publish images to Docker Hub

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    # Manual publishing is restricted to the trusted release branch too.
    if: github.ref == 'refs/heads/master'
    strategy:
      fail-fast: false
      matrix:
        version:
          - { php: "8.4", node: "22" }
          - { php: "8.3", node: "20" }
          - { php: "8.2", node: "18" }
          - { php: "8.1", node: "16" }
        platform:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    uses: ./.github/workflows/build-images.yml
    with:
      php-version: ${{ matrix.version.php }}
      node-version: ${{ matrix.version.node }}
      arch: ${{ matrix.platform.arch }}
      runner: ${{ matrix.platform.runner }}
      publish: true
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  manifests:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - { php: "8.4", node: "22" }
          - { php: "8.3", node: "20" }
          - { php: "8.2", node: "18" }
          - { php: "8.1", node: "16" }
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-php-${{ matrix.php }}-*
          path: digests
          merge-multiple: true
      - name: Assemble multi-platform tags
        env:
          PHP_VERSION: ${{ matrix.php }}
          NODE_VERSION: ${{ matrix.node }}
        shell: bash
        run: |
          set -euo pipefail
          test -s digests/amd64.json
          test -s digests/arm64.json
          mapfile -t fpm < <(jq -r '"croneu/phpapp-fpm@" + .fpm' digests/amd64.json digests/arm64.json)
          mapfile -t ssh < <(jq -r '"croneu/phpapp-ssh@" + .ssh' digests/amd64.json digests/arm64.json)
          docker buildx imagetools create --tag "croneu/phpapp-fpm:php-$PHP_VERSION" "${fpm[@]}"
          docker buildx imagetools create --tag "croneu/phpapp-ssh:php-$PHP_VERSION-node-$NODE_VERSION" "${ssh[@]}"
