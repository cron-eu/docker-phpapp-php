name: Publish images to Docker Hub

on:
  workflow_dispatch:
    inputs:
      expected-versions:
        description: 'JSON map of PHP minors to required full patch versions; builds only listed branches'
        type: string
        required: true
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  prepare:
    if: github.ref == 'refs/heads/master'
    uses: ./.github/workflows/resolve-bases.yml
    with:
      expected-versions: ${{ inputs.expected-versions || '{}' }}
      require-expected-versions: ${{ github.event_name == 'workflow_dispatch' }}

  build:
    name: PHP ${{ matrix.version.php }} / Node ${{ matrix.version.node }} / ${{ matrix.platform.arch }}
    needs: prepare
    # Manual publishing is restricted to the trusted release branch too.
    if: github.ref == 'refs/heads/master'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.prepare.outputs.versions) }}
        platform:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    uses: ./.github/workflows/build-images.yml
    with:
      php-version: ${{ matrix.version.php }}
      base-image: ${{ matrix.version.base_image }}
      expected-php-version: ${{ matrix.version.expected_php_version }}
      node-version: ${{ matrix.version.node }}
      arch: ${{ matrix.platform.arch }}
      runner: ${{ matrix.platform.runner }}
      publish: true
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  manifests:
    name: Publish PHP ${{ matrix.version.php }} manifests
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        version: ${{ fromJSON(needs.prepare.outputs.versions) }}
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-php-${{ matrix.version.php }}-*
          path: digests
          merge-multiple: true
      - name: Assemble multi-platform tags
        env:
          PHP_VERSION: ${{ matrix.version.php }}
          NODE_VERSION: ${{ matrix.version.node }}
          PHP_BASE_IMAGE: ${{ matrix.version.base_image }}
          EXPECTED_PHP_VERSION: ${{ matrix.version.expected_php_version }}
        shell: bash
        run: |
          set -euo pipefail
          test -s digests/amd64.json
          test -s digests/arm64.json
          jq -se --arg base "$PHP_BASE_IMAGE" --arg php "$EXPECTED_PHP_VERSION" \
            'all(.[]; .base_image == $base and .php_version == $php)' digests/amd64.json digests/arm64.json
          mapfile -t fpm < <(jq -r '"croneu/phpapp-fpm@" + .fpm' digests/amd64.json digests/arm64.json)
          mapfile -t ssh < <(jq -r '"croneu/phpapp-ssh@" + .ssh' digests/amd64.json digests/arm64.json)
          docker buildx imagetools create --tag "croneu/phpapp-fpm:php-$PHP_VERSION" "${fpm[@]}"
          docker buildx imagetools create --tag "croneu/phpapp-ssh:php-$PHP_VERSION-node-$NODE_VERSION" "${ssh[@]}"

  descriptions:
    needs: manifests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Update FPM Docker Hub description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: croneu/phpapp-fpm
          short-description: ${{ github.event.repository.description }} - PHP-FPM

      - name: Update SSH Docker Hub description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: croneu/phpapp-ssh
          short-description: ${{ github.event.repository.description }} - SSH
