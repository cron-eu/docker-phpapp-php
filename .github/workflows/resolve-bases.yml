name: Resolve PHP base images

on:
  workflow_call:
    inputs:
      latest-releases:
        description: Require the latest announced PHP patches and wait for Docker availability
        type: boolean
        default: false
    outputs:
      versions:
        description: Version matrix with immutable base images and exact PHP patches
        value: ${{ jobs.resolve.outputs.versions }}

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    outputs:
      versions: ${{ steps.bases.outputs.versions }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Test base image resolver
        run: make test-resolver
      - name: Resolve and verify both architectures
        id: bases
        env:
          LATEST_RELEASES: ${{ inputs.latest-releases }}
        run: |
          args=()
          if [[ "$LATEST_RELEASES" == true ]]; then
            args+=(--latest-releases --wait-seconds 3600)
          fi
          python3 scripts/resolve-bases.py \
            --summary "$GITHUB_STEP_SUMMARY" \
            "${args[@]}" > resolved-bases.json
          echo "versions=$(cat resolved-bases.json)" >> "$GITHUB_OUTPUT"
