name: Build and test images

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        version:
          - { php: "8.4", node: "22" }
          - { php: "8.3", node: "20" }
          - { php: "8.2", node: "18" }
          - { php: "8.1", node: "16" }
        platform:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    uses: ./.github/workflows/build-images.yml
    with:
      php-version: ${{ matrix.version.php }}
      node-version: ${{ matrix.version.node }}
      arch: ${{ matrix.platform.arch }}
      runner: ${{ matrix.platform.runner }}
      publish: false
