name: Build PHP image pair

on:
  workflow_call:
    inputs:
      php-version:
        required: true
        type: string
      node-version:
        required: true
        type: string
      arch:
        required: true
        type: string
      runner:
        required: true
        type: string
      publish:
        default: false
        type: boolean
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    env:
      PHP_VERSION: ${{ inputs.php-version }}
      NODE_VERSION: ${{ inputs.node-version }}
      PLATFORMS: linux/${{ inputs.arch }}
      CACHE_ARCH: ${{ inputs.arch }}
      FPM_IMAGE: phpapp-fpm:test
      SSH_IMAGE: phpapp-ssh:test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build and load both images
        uses: docker/bake-action@v6
        with:
          files: |
            docker-bake.hcl
            docker-bake.ci.hcl
          load: true

      - name: Login to Docker Hub
        if: inputs.publish
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Export the same build graph from the builder cache after local validation.
      # Each job publishes distinct candidate tags; public tags are merged later.
      - name: Publish architecture candidates
        if: inputs.publish
        id: publish
        uses: docker/bake-action@v6
        with:
          files: |
            docker-bake.hcl
            docker-bake.ci.hcl
          push: true
          set: |
            fpm.tags=croneu/phpapp-fpm:build-${{ github.run_id }}-${{ github.run_attempt }}-php-${{ inputs.php-version }}-${{ inputs.arch }}
            ssh.tags=croneu/phpapp-ssh:build-${{ github.run_id }}-${{ github.run_attempt }}-php-${{ inputs.php-version }}-node-${{ inputs.node-version }}-${{ inputs.arch }}

      - name: Record image digests
        if: inputs.publish
        env:
          BUILD_METADATA: ${{ steps.publish.outputs.metadata }}
          ARCH: ${{ inputs.arch }}
        run: |
          mkdir -p digests
          printf '%s' "$BUILD_METADATA" | jq -e '
            {fpm: .fpm["containerimage.digest"], ssh: .ssh["containerimage.digest"]}
            | select(.fpm | test("^sha256:[0-9a-f]{64}$"))
            | select(.ssh | test("^sha256:[0-9a-f]{64}$"))
          ' > "digests/$ARCH.json"

      - name: Upload digests for manifest assembly
        if: inputs.publish
        uses: actions/upload-artifact@v4
        with:
          name: digests-php-${{ inputs.php-version }}-${{ inputs.arch }}
          path: digests/*.json
          retention-days: 1

      - name: Update FPM Docker Hub description
        if: inputs.publish
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: croneu/phpapp-fpm
          short-description: ${{ github.event.repository.description }} - PHP-FPM

      - name: Update SSH Docker Hub description
        if: inputs.publish
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: croneu/phpapp-ssh
          short-description: ${{ github.event.repository.description }} - SSH
