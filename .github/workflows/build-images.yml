name: Build PHP image pair

on:
  workflow_call:
    inputs:
      php-version:
        required: true
        type: string
      base-image:
        required: true
        type: string
      expected-php-version:
        required: true
        type: string
      node-version:
        required: true
        type: string
      arch:
        required: true
        type: string
      runner:
        required: true
        type: string
      publish:
        default: false
        type: boolean
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  build:
    # PR callers pass no registry secrets and cannot enter publishing steps.
    if: ${{ !inputs.publish || (github.event_name != 'pull_request' && github.ref == 'refs/heads/master') }}
    runs-on: ${{ inputs.runner }}
    env:
      PHP_VERSION: ${{ inputs.php-version }}
      PHP_BASE_IMAGE: ${{ inputs.base-image }}
      EXPECTED_PHP_VERSION: ${{ inputs.expected-php-version }}
      NODE_VERSION: ${{ inputs.node-version }}
      PLATFORMS: linux/${{ inputs.arch }}
      CACHE_ARCH: ${{ inputs.arch }}
      FPM_IMAGE: phpapp-fpm:test
      SSH_IMAGE: phpapp-ssh:test
    steps:
      - name: Verify native runner architecture
        env:
          EXPECTED_ARCH: ${{ inputs.arch }}
        run: |
          case "$EXPECTED_ARCH:$(uname -m)" in
            amd64:x86_64|arm64:aarch64) ;;
            *) echo "Runner does not match requested architecture" >&2; exit 1 ;;
          esac

      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3

      - name: Build and load both images
        uses: docker/bake-action@v6
        with:
          files: |
            docker-bake.hcl
            docker-bake.ci.hcl
          load: true
          pull: true

      - name: Test both image runtimes
        run: make test

      - name: Login to Docker Hub
        if: inputs.publish
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Export the same build graph from the builder cache after local validation.
      # Each job publishes distinct candidate tags; public tags are merged later.
      - name: Publish architecture candidates
        if: inputs.publish
        id: publish
        uses: docker/bake-action@v6
        with:
          files: |
            docker-bake.hcl
            docker-bake.ci.hcl
          push: true
          pull: true
          set: |
            fpm.tags=croneu/phpapp-fpm:build-${{ github.run_id }}-${{ github.run_attempt }}-php-${{ inputs.php-version }}-${{ inputs.arch }}
            ssh.tags=croneu/phpapp-ssh:build-${{ github.run_id }}-${{ github.run_attempt }}-php-${{ inputs.php-version }}-node-${{ inputs.node-version }}-${{ inputs.arch }}

      - name: Record image digests
        if: inputs.publish
        env:
          BUILD_METADATA: ${{ steps.publish.outputs.metadata }}
          ARCH: ${{ inputs.arch }}
        run: |
          # A second solve must export exactly the configurations tested above.
          # Fail before manifest promotion if a floating upstream input changed.
          fpm_config=$(docker image inspect --format '{{.Id}}' "$FPM_IMAGE")
          ssh_config=$(docker image inspect --format '{{.Id}}' "$SSH_IMAGE")
          printf '%s' "$BUILD_METADATA" | jq -e --arg fpm "$fpm_config" --arg ssh "$ssh_config" '
            .fpm["containerimage.config.digest"] == $fpm and
            .ssh["containerimage.config.digest"] == $ssh
          '
          mkdir -p digests
          printf '%s' "$BUILD_METADATA" | jq -e --arg base "$PHP_BASE_IMAGE" --arg php "$EXPECTED_PHP_VERSION" '
            {fpm: .fpm["containerimage.digest"], ssh: .ssh["containerimage.digest"],
             base_image: $base, php_version: $php}
            | select(.fpm | test("^sha256:[0-9a-f]{64}$"))
            | select(.ssh | test("^sha256:[0-9a-f]{64}$"))
          ' > "digests/$ARCH.json"

      - name: Upload digests for manifest assembly
        if: inputs.publish
        uses: actions/upload-artifact@v4
        with:
          name: digests-php-${{ inputs.php-version }}-${{ inputs.arch }}
          path: digests/*.json
          overwrite: true
          retention-days: 1
