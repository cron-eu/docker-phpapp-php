name: Build PHP image pair

on:
  workflow_call:
    inputs:
      php-version:
        required: true
        type: string
      node-version:
        required: true
        type: string
      arch:
        required: true
        type: string
      runner:
        required: true
        type: string
      publish:
        default: false
        type: boolean
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  build:
    # PR callers pass no registry secrets and cannot enter publishing steps.
    if: ${{ !inputs.publish || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') }}
    runs-on: ${{ inputs.runner }}
    env:
      PHP_VERSION: ${{ inputs.php-version }}
      NODE_VERSION: ${{ inputs.node-version }}
      ARCH: ${{ inputs.arch }}
      PLATFORMS: linux/${{ inputs.arch }}
      CACHE_ARCH: ${{ inputs.arch }}
      FPM_IMAGE: phpapp-fpm:test
      SSH_IMAGE: phpapp-ssh:test
    steps:
      - name: Verify native runner architecture
        run: |
          case "$ARCH:$(uname -m)" in
            amd64:x86_64|arm64:aarch64) ;;
            *) echo "Runner does not match requested architecture" >&2; exit 1 ;;
          esac

      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3

      - name: Build and load both images
        uses: docker/bake-action@v6
        with:
          files: |
            docker-bake.hcl
            docker-bake.ci.hcl
          load: true
          pull: true

      - name: Test both image runtimes
        run: make test

      - name: Report image versions
        run: |
          fpm_php=$(docker run --rm --entrypoint php "$FPM_IMAGE" -r 'echo PHP_VERSION;')
          ssh_php=$(docker run --rm --entrypoint php "$SSH_IMAGE" -r 'echo PHP_VERSION;')
          ssh_node=$(docker run --rm --entrypoint node "$SSH_IMAGE" --version)
          {
            echo "### PHP $PHP_VERSION / Node $NODE_VERSION / $ARCH"
            echo "| Image | PHP | Node |"
            echo "| --- | --- | --- |"
            echo "| phpapp-fpm | $fpm_php | |"
            echo "| phpapp-ssh | $ssh_php | $ssh_node |"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Login to Docker Hub
        if: inputs.publish
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Push exactly the tested images. Public tags are merged from these
      # candidates only after every architecture job has passed.
      - name: Push architecture candidates
        if: inputs.publish
        env:
          CANDIDATE: build-${{ github.run_id }}-php-${{ inputs.php-version }}
        run: |
          fpm="croneu/phpapp-fpm:$CANDIDATE-$ARCH"
          ssh="croneu/phpapp-ssh:$CANDIDATE-node-$NODE_VERSION-$ARCH"
          docker tag "$FPM_IMAGE" "$fpm"
          docker tag "$SSH_IMAGE" "$ssh"
          docker push "$fpm"
          docker push "$ssh"
